<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WaveDrom Library & Editor</title>
<script src="https://wavedrom.com/skins/default.js" type="text/javascript"></script>
<script src="https://wavedrom.com/wavedrom.min.js" type="text/javascript"></script>
<script src="wavedrom-custom-styling.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  
  /* ========================================
     CUSTOMIZE: Sidebar appearance
     ======================================== */
  #sidebar {
    width: 280px;              /* CUSTOMIZE: Sidebar default width */
    min-width: 150px;          /* CUSTOMIZE: Minimum sidebar width when resizing */
    background: #f5f5f5;       /* CUSTOMIZE: Sidebar background color */
    overflow-y: auto;
    padding: 15px;             /* CUSTOMIZE: Sidebar padding */
    flex-shrink: 0;
    position: relative;    /* ADD THIS LINE */
  }
  #sidebar h2 {
    font-size: 18px;           /* CUSTOMIZE: Sidebar title font size */
    margin-bottom: 15px;
    color: #333;               /* CUSTOMIZE: Sidebar title color */
  }
   #sidebar h2 a {
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s;
   }
   #sidebar h2 a:hover {
     opacity: 0.7;
     text-decoration: underline;
   }
   .folder {
    font-weight: bold;
    color: #0366d6;            /* CUSTOMIZE: Folder name color */
    margin-top: 12px;
    margin-bottom: 25px;
    font-size: 14px;           /* CUSTOMIZE: Folder name font size */
  }
  .file {
    padding: 6px 10px;         /* CUSTOMIZE: File item padding */
    margin: 2px 0;
    margin-left: 8px;
    cursor: pointer;
    border-radius: 4px;
    background: white;         /* CUSTOMIZE: File item background */
    border: 1px solid #ddd;    /* CUSTOMIZE: File item border */
    font-size: 15px;           /* CUSTOMIZE: File name font size */
    transition: all 0.2s;
  }
  .file:hover {
    background: #e3f2fd;       /* CUSTOMIZE: File hover background */
    border-color: #2196F3;     /* CUSTOMIZE: File hover border */
  }
  .file.active {
    background: #2196F3;       /* CUSTOMIZE: Active file background */
    color: white;              /* CUSTOMIZE: Active file text color */
    border-color: #2196F3;
  }
  .version {
    font-size: 10px;           /* CUSTOMIZE: Version text size */
    color: #999;               /* CUSTOMIZE: Version text color */
    margin-top: 15px;
    text-align: center;
  }
  .loading {
    color: #2196F3;            /* CUSTOMIZE: Loading text color */
    font-style: italic;
    padding: 10px;
  }
  .error {
    color: #f44336;            /* CUSTOMIZE: Error text color */
    padding: 10px;
    background: #ffebee;       /* CUSTOMIZE: Error background */
    border-radius: 4px;
    margin: 10px 0;
    font-size: 13px;
  }
  
  /* ========================================
     CUSTOMIZE: Resize handles
     ======================================== */
  .resize-handle {
    width: 10px;                /* CUSTOMIZE: Handle width */
    background: #ddd;   /* CUSTOMIZE: Handle color (transparent = invisible until hover) */
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.2s;
    user-select: none;    
  }
  .resize-handle:hover {
    background: #2196F3;       /* CUSTOMIZE: Handle color on hover */
  }
  
  /* ========================================
     CUSTOMIZE: Editor container
     ======================================== */
  #editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* ========================================
     CUSTOMIZE: Header bar
     ======================================== */
  #header {
    background: #2196F3;       /* CUSTOMIZE: Header background color */
    color: white;              /* CUSTOMIZE: Header text color */
    padding: 12px 20px;        /* CUSTOMIZE: Header padding */
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  #header h1 {
    font-size: 18px;           /* CUSTOMIZE: Header title font size */
    font-weight: 500;
  }
  #header .controls {
    display: flex;
    gap: 10px;
  }
  
  /* ========================================
     CUSTOMIZE: Header buttons
     ======================================== */
  #header button {
    padding: 6px 16px;         /* CUSTOMIZE: Button padding */
    background: white;         /* CUSTOMIZE: Button background */
    color: #2196F3;            /* CUSTOMIZE: Button text color */
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;           /* CUSTOMIZE: Button font size */
    font-weight: 500;
  }
  #header button:hover {
    background: #f0f0f0;       /* CUSTOMIZE: Button hover background */
  }
  
  /* ========================================
     CUSTOMIZE: Workspace
     ======================================== */
  #workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  
  /* ========================================
     CUSTOMIZE: Code editor
     ======================================== */
  #code-editor {
    width: 50%;                /* CUSTOMIZE: Code editor default width (50% = half screen) */
    min-width: 200px;          /* CUSTOMIZE: Minimum code editor width when resizing */
    display: flex;
    flex-direction: column;
    height: 100%;           /* ADD THIS - ensure it fills workspace height */   
  }
  
  /* ========================================
     CUSTOMIZE: Code editor textarea (colors, fonts)
     ======================================== */
  #code-editor textarea {
    flex: 1;
    padding: 15px;             /* CUSTOMIZE: Code editor padding */
    font-family: 'Monaco', 'Menlo', 'Courier New', monospace; /* CUSTOMIZE: Code font */
    font-size: 14px;           /* CUSTOMIZE: Code font size */
    border: none;
    resize: none;
    outline: none;
    background: #1e1e1e;       /* CUSTOMIZE: Code background color (dark theme) */
    color: #d4d4d4;            /* CUSTOMIZE: Code text color */
  }
 /* ========================================
   CUSTOMIZE: CodeMirror styling
   ======================================== */
.CodeMirror {
  height: 100% !important;   /* Fill the entire code-editor area */
  font-size: 14px;
  font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
  padding-top: 15px;        /* CUSTOMIZE: Top padding inside code editor */
  padding-left: 5px;        /* CUSTOMIZE: Top padding inside code editor */
}

 .CodeMirror-scroll {
  height: 100%;
}
  
  /* Try these alternative color schemes:
     Light theme:
       background: #ffffff;
       color: #000000;
     
     Darker theme:
       background: #282c34;
       color: #abb2bf;
     
     Monokai:
       background: #272822;
       color: #f8f8f2;
  */
  
  /* ========================================
     CUSTOMIZE: Diagram viewer
     ======================================== */
  #diagram-viewer {
    flex: 1;
    overflow: auto;
    background: white;         /* CUSTOMIZE: Diagram background color */
    padding: 20px;             /* CUSTOMIZE: Diagram area padding */
  }
  #diagram-output {
    min-height: 100%;
  }
  
  /* ========================================
     CUSTOMIZE: Welcome message
     ======================================== */
  .welcome-message {
    text-align: center;
    color: #999;               /* CUSTOMIZE: Welcome text color */
    padding: 60px 20px;
    font-size: 16px;           /* CUSTOMIZE: Welcome text size */
  }
  
  /* ========================================
     CUSTOMIZE: Status bar
     ======================================== */
  .status {
    padding: 8px 15px;         /* CUSTOMIZE: Status bar padding */
    background: #fff3cd;       /* CUSTOMIZE: Status background */
    border-top: 1px solid #ffc107;
    font-size: 12px;           /* CUSTOMIZE: Status text size */
    color: #856404;            /* CUSTOMIZE: Status text color */
  }
 /* ========================================
   CUSTOMIZE: Editor link at bottom
   ======================================== */
.editor-link {
  position: absolute;
  bottom: 40px;
  left: 40px;
  font-size: 14px;
  padding: 5px 10px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 4px;
  transition: all 0.2s;
}

.editor-link a {
  color: #0366d6;
  text-decoration: none;
}

.editor-link:hover {
  background: #e3f2fd;
  border-color: #2196F3;
}

</style>
</head>
<body>

<div id="sidebar">
  <h2><a href="https://github.com/velikotny-design/wavedrom-library" target="_blank">📚 WaveDrom Library</a></h2>
  <div class="loading">Loading files...</div>
  <!-- ADD THIS AT THE END, before closing </div>: -->
  <div class="editor-link">
    <a href="https://wavedrom.com/editor.html" target="_blank">✏️ WaveDrom Editor</a>
  </div>
</div>

<div class="resize-handle" id="resize-handle-left"></div>

<div id="editor-container">
  <div id="header">
    <h1 id="current-file">Select a file to start</h1>
    <div class="controls">
      <button onclick="toggleNodes()" id="nodeToggleBtn">👁️ Show Nodes</button>
      <button onclick="renderDiagram()">🔄 Render</button>
      <button onclick="downloadSVG()">💾 Save SVG</button>
      <button onclick="clearEditor()">🗑️ Clear</button>
    </div>
  </div>

 
  
  <div id="workspace">
    <div id="code-editor">
      <textarea id="code-input" placeholder="Load a file or paste WaveDrom JSON here..."></textarea>
    </div>
    
    <div class="resize-handle" id="resize-handle-right"></div>
    
    <div id="diagram-viewer">
      <div id="diagram-output">
        <div class="welcome-message">
          👈 Select a file from the sidebar to view and edit
        </div>
      </div>
    </div>
  </div>
  
  <div id="status" class="status" style="display: none;"></div>
</div>

<script>
var REPO_OWNER = 'velikotny-design';
var REPO_NAME = 'wavedrom-library';
var BRANCH = 'main';
var currentPath = null;
var autoStyleEnabled = true;
var editor;
 
window.onload = function() {
  loadFileList();
  setupAutoRender();
  setupCodeMirror();      // ADD THIS LINE!
  setupResizablePanes();
};

 function setupCodeMirror() {
  var textarea = document.getElementById('code-input');
  editor = CodeMirror.fromTextArea(textarea, {
    mode: 'javascript',
    theme: 'monokai',
    lineNumbers: true,
    lineWrapping: true
  });
  
  editor.on('change', function() {
    clearTimeout(window.renderTimeout);
    window.renderTimeout = setTimeout(renderDiagram, 1000);
  });
}

function loadFileList() {
  var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/git/trees/' + BRANCH + '?recursive=1';
  
  fetch(apiUrl, {cache: 'no-cache'})
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load repository');
      return res.json();
    })
    .then(function(data) {
      var jsonFiles = data.tree.filter(function(item) {
        return item.type === 'blob' && 
               item.path.endsWith('.json') && 
               item.path !== 'package.json';
      });
      
      renderFileTree(jsonFiles);
    })
    .catch(function(err) {
      document.getElementById('sidebar').innerHTML = 
        '<h2>📚 WaveDrom Library</h2><div class="error">Error: ' + err.message + '</div>';
    });
}

function renderFileTree(files) {
  var tree = {};
  
  files.forEach(function(file) {
    var parts = file.path.split('/');
    var folder = parts.length > 1 ? parts[0] : 'root';
    if (!tree[folder]) tree[folder] = [];
    tree[folder].push(file.path);
  });
  
  var sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h2><a href="https://github.com/velikotny-design/wavedrom-library" target="_blank">📚 WaveDrom Library</a></h2>';
  
  Object.keys(tree).sort().forEach(function(folder) {
    var folderDiv = document.createElement('div');
    folderDiv.className = 'folder';
    folderDiv.textContent = '📁 ' + folder;
    sidebar.appendChild(folderDiv);
    
    tree[folder].sort().forEach(function(path) {
      var filename = path.split('/').pop();
      var displayName = filename.replace(/\.json$/, '');  // Strip .json extension
      var fileDiv = document.createElement('div');
      fileDiv.className = 'file';
      fileDiv.textContent = '📄 ' + displayName;  // Show without .json
      fileDiv.onclick = function() {
        loadFile(path);
        document.querySelectorAll('.file').forEach(function(f) {
          f.classList.remove('active');
        });
        fileDiv.classList.add('active');
      };
      sidebar.appendChild(fileDiv);
    });
  });
  
  var versionDiv = document.createElement('div');
  versionDiv.className = 'version';
  versionDiv.textContent = files.length + ' files loaded';
  sidebar.appendChild(versionDiv);
 // ADD THIS:
var editorLink = document.createElement('div');
editorLink.className = 'editor-link';
editorLink.innerHTML = '<a href="https://wavedrom.com/editor.html" target="_blank">✏️ WaveDrom Editor</a>';
sidebar.appendChild(editorLink);
}

function showStatus(message, isError) {
  var statusDiv = document.getElementById('status');
  if (!statusDiv) return;
  
  statusDiv.textContent = message;
  statusDiv.style.display = 'block';
  statusDiv.style.background = isError ? '#ffebee' : '#fff3cd';
  statusDiv.style.color = isError ? '#c62828' : '#856404';
  statusDiv.style.borderTop = '1px solid ' + (isError ? '#ef5350' : '#ffc107');
  
  setTimeout(function() {
    statusDiv.style.display = 'none';
  }, 3000);
}

// ============================================
// PART 1 ENDS HERE - Continue with Part 2
// ============================================

function loadFile(path) {
  currentPath = path;
  document.getElementById('current-file').textContent = path; 
  showStatus('Loading ' + path + '...');
  
  var rawUrl = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/' + BRANCH + '/' + path;
  
  fetch(rawUrl + '?nocache=' + Date.now())
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load file');
      return res.text();
    })
    .then(function(content) {  
      if (editor) {
        editor.setValue(content);
      } else {
        document.getElementById('code-input').value = content;
      }
      showStatus('Loaded ' + path);
      renderDiagram();
    })
    .catch(function(err) {
      showStatus('Error: ' + err.message, true);
    });
}

function setupAutoRender() {
  var textarea = document.getElementById('code-input');
  var timeout = null;
  
  textarea.addEventListener('input', function() {
    clearTimeout(timeout);
    timeout = setTimeout(renderDiagram, 1000);
  });
}

function renderDiagram() {  
  var code = editor ? editor.getValue().trim() : document.getElementById('code-input').value.trim();
  var output = document.getElementById('diagram-output');
  
  if (!code) {
    output.innerHTML = '<div class="welcome-message">Enter WaveDrom JSON to render</div>';
    return;
  }
  
  try {
    var wavedata;
    try {
      wavedata = JSON.parse(code);
    } catch(e) {
      wavedata = eval('(' + code + ')');
    }
    
    output.innerHTML = '';
    
    var script = document.createElement('script');
    script.type = 'WaveDrom';
    script.textContent = JSON.stringify(wavedata);
    output.appendChild(script);
    
    console.log('Processing WaveDrom...');
    WaveDrom.ProcessAll();
    
    setTimeout(function() {
      console.log('Applying custom styling...');
      if (autoStyleEnabled && typeof applyCustomStyling === 'function') {
        applyCustomStyling();
        if (typeof setupAutoStyling === 'function') {
          setupAutoStyling();
        }
      }
    }, 700);
    
    console.log('Diagram rendered');
    
  } catch(e) {
    console.error('Render error:', e);
    output.innerHTML = '<div class="error">Error rendering diagram:<br><br>' + e.message + '</div>';
  }
}

 var nodesVisible = false;

function toggleNodes() {
  nodesVisible = !nodesVisible;
  window.showNodes = nodesVisible;
  
  var btn = document.getElementById('nodeToggleBtn');
  btn.textContent = nodesVisible ? '🙈 Hide Nodes' : '👁️ Show Nodes';
  
  // Apply immediately without full re-render
  document.querySelectorAll('#wavearcs_0 > g > text').forEach(function(el){
    if(el.textContent.trim().length === 1) {
      if(window.showNodes) {
        el.style.fill = 'black';
        el.style.opacity = '1';
        el.parentNode.querySelectorAll('rect').forEach(function(rect) {
          rect.style.fill = 'white';
        });
      } else {
        el.style.fill = 'transparent';
        el.parentNode.querySelectorAll('rect').forEach(function(rect) {
          rect.style.fill = 'transparent';
        });
      }
    }
  });
}


function clearEditor() {
  document.getElementById('code-input').value = '';
  document.getElementById('diagram-output').innerHTML = '<div class="welcome-message">Editor cleared</div>';
  document.getElementById('current-file').textContent = 'No file loaded';
  currentPath = null;
}

function downloadSVG() {
  var svg = document.querySelector('#diagram-output svg');
  if (!svg) {
    alert('No diagram to download. Render a diagram first.');
    return;
  }
  
  var svgData = new XMLSerializer().serializeToString(svg);
  var blob = new Blob([svgData], {type: 'image/svg+xml'});
  var url = URL.createObjectURL(blob);
  
  var a = document.createElement('a');
  a.href = url;
  a.download = (currentPath ? currentPath.replace('.json', '') : 'diagram') + '.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

 function setupResizablePanes() {
  var handleLeft = document.getElementById('resize-handle-left');
  var handleRight = document.getElementById('resize-handle-right');
  var sidebar = document.getElementById('sidebar');
  var codeEditor = document.getElementById('code-editor');
  var workspace = document.getElementById('workspace');
  
  var isResizingLeft = false;
  var isResizingRight = false;
  
  if (handleLeft && sidebar) {
    handleLeft.addEventListener('mousedown', function(e) {
      isResizingLeft = true;
      document.body.style.cursor = 'col-resize';
      e.preventDefault();
    });
  }
  
  if (handleRight && codeEditor && workspace) {
    handleRight.addEventListener('mousedown', function(e) {
      isResizingRight = true;
      document.body.style.cursor = 'col-resize';
      e.preventDefault();
    });
  }
  
  document.addEventListener('mousemove', function(e) {
    if (isResizingLeft && sidebar) {
      var newWidth = e.clientX;
      if (newWidth >= 150 && newWidth <= 500) {
        sidebar.style.width = newWidth + 'px';
      }
    }
    
    if (isResizingRight && codeEditor && workspace) {
      var workspaceRect = workspace.getBoundingClientRect();
      var offsetX = e.clientX - workspaceRect.left;
      var percentage = (offsetX / workspaceRect.width) * 100;
      
      if (percentage >= 20 && percentage <= 80) {
        codeEditor.style.width = percentage + '%';
      }
    }
  });
  
  document.addEventListener('mouseup', function() {
    if (isResizingLeft || isResizingRight) {
      isResizingLeft = false;
      isResizingRight = false;
      document.body.style.cursor = 'default';
    }
  });
}

</script>
</body>
</html>
