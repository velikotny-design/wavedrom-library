<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WaveDrom Library & Editor</title>
<script src="https://wavedrom.com/skins/default.js" type="text/javascript"></script>
<script src="https://wavedrom.com/wavedrom.min.js" type="text/javascript"></script>
<script src="wavedrom-custom-styling.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  
  #sidebar {
    width: 280px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 15px;
    flex-shrink: 0;
  }
  
  #sidebar h2 {
    font-size: 18px;
    margin-bottom: 15px;
    color: #333;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 12px;
    margin-bottom: 5px;
    font-size: 14px;
  }
  
  .file {
    padding: 6px 10px;
    margin: 2px 0;
    margin-left: 8px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    font-size: 13px;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  .version {
    font-size: 10px;
    color: #999;
    margin-top: 15px;
    text-align: center;
  }
  
  .loading {
    color: #2196F3;
    font-style: italic;
    padding: 10px;
  }
  
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
    margin: 10px 0;
    font-size: 13px;
  }
  
  #editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  #header {
    background: #2196F3;
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  
  #header h1 {
    font-size: 18px;
    font-weight: 500;
  }
  
  #header .controls {
    display: flex;
    gap: 10px;
  }
  
  #header button {
    padding: 6px 16px;
    background: white;
    color: #2196F3;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  
  #header button:hover {
    background: #f0f0f0;
  }
  
  #workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  
  #code-editor {
    width: 40%;
    min-width: 200px;
    display: flex;
    flex-direction: column;
  }
  
  #code-editor textarea {
    flex: 1;
    padding: 15px;
    font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
    font-size: 14px;
    border: none;
    resize: none;
    outline: none;
    background: #282c34;
    color: #abb2bf;
    line-height: 1.5;
  }
  
  #resize-handle {
    width: 5px;
    background: #ddd;
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.2s;
    user-select: none;
  }
  
  #resize-handle:hover {
    background: #2196F3;
  }
  
  #diagram-viewer {
    flex: 1;
    overflow: auto;
    background: #f8f9fa;
    padding: 20px;
  }
  
  #diagram-output {
    min-height: 100%;
  }
  
  .welcome-message {
    text-align: center;
    color: #999;
    padding: 60px 20px;
    font-size: 16px;
  }
  
  .status {
    padding: 8px 15px;
    background: #fff3cd;
    border-top: 1px solid #ffc107;
    font-size: 12px;
    color: #856404;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  <div class="loading">Loading files...</div>
</div>

<div id="editor-container">
  <div id="header">
    <h1 id="current-file">Select a file to start</h1>
    <div class="controls">
      <button onclick="renderDiagram()">🔄 Render</button>
      <button onclick="downloadSVG()">💾 Save SVG</button>
      <button onclick="clearEditor()">🗑️ Clear</button>
    </div>
  </div>
  
  <div id="workspace">
    <div id="code-editor">
      <textarea id="code-input" placeholder="Load a file or paste WaveDrom JSON here..."></textarea>
    </div>
    
    <div id="resize-handle"></div>
    
    <div id="diagram-viewer">
      <div id="diagram-output">
        <div class="welcome-message">
          👈 Select a file from the sidebar to view and edit
        </div>
      </div>
    </div>
  </div>
  
  <div id="status" class="status" style="display: none;"></div>
</div>

<script>
var REPO_OWNER = 'velikotny-design';
var REPO_NAME = 'wavedrom-library';
var BRANCH = 'main';
var currentPath = null;
var autoStyleEnabled = true;

window.onload = function() {
  loadFileList();
  setupAutoRender();
  setupResizablePanes();
};

function loadFileList() {
  var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/git/trees/' + BRANCH + '?recursive=1';
  
  fetch(apiUrl, {cache: 'no-cache'})
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load repository');
      return res.json();
    })
    .then(function(data) {
      var jsonFiles = data.tree.filter(function(item) {
        return item.type === 'blob' && 
               item.path.endsWith('.json') && 
               item.path !== 'package.json';
      });
      
      renderFileTree(jsonFiles);
    })
    .catch(function(err) {
      document.getElementById('sidebar').innerHTML = 
        '<h2>📚 WaveDrom Library</h2><div class="error">Error: ' + err.message + '</div>';
    });
}

function renderFileTree(files) {
  var tree = {};
  
  files.forEach(function(file) {
    var parts = file.path.split('/');
    var folder = parts.length > 1 ? parts[0] : 'root';
    if (!tree[folder]) tree[folder] = [];
    tree[folder].push(file.path);
  });
  
  var sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h2>📚 WaveDrom Library</h2>';
  
  Object.keys(tree).sort().forEach(function(folder) {
    var folderDiv = document.createElement('div');
    folderDiv.className = 'folder';
    folderDiv.textContent = '📁 ' + folder;
    sidebar.appendChild(folderDiv);
    
    tree[folder].sort().forEach(function(path) {
      var filename = path.split('/').pop();
      var fileDiv = document.createElement('div');
      fileDiv.className = 'file';
      fileDiv.textContent = '📄 ' + filename;
      fileDiv.onclick = function() {
        loadFile(path);
        document.querySelectorAll('.file').forEach(function(f) {
          f.classList.remove('active');
        });
        fileDiv.classList.add('active');
      };
      sidebar.appendChild(fileDiv);
    });
  });
  
  var versionDiv = document.createElement('div');
  versionDiv.className = 'version';
  versionDiv.textContent = files.length + ' files loaded';
  sidebar.appendChild(versionDiv);
}

function showStatus(message, isError) {
  var statusDiv = document.getElementById('status');
  if (!statusDiv) return;
  
  statusDiv.textContent = message;
  statusDiv.style.display = 'block';
  statusDiv.style.background = isError ? '#ffebee' : '#fff3cd';
  statusDiv.style.color = isError ? '#c62828' : '#856404';
  statusDiv.style.borderTop = '1px solid ' + (isError ? '#ef5350' : '#ffc107');
  
  setTimeout(function() {
    statusDiv.style.display = 'none';
  }, 3000);
}

function loadFile(path) {
  currentPath = path;
  document.getElementById('current-file').textContent = path;
  showStatus('Loading ' + path + '...');
  
  var rawUrl = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/' + BRANCH + '/' + path;
  
  fetch(rawUrl + '?nocache=' + Date.now())
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load file');
      return res.text();
    })
    .then(function(content) {
      document.getElementById('code-input').value = content;
      showStatus('Loaded ' + path);
      renderDiagram();
    })
    .catch(function(err) {
      showStatus('Error: ' + err.message, true);
    });
}

function setupAutoRender() {
  var textarea = document.getElementById('code-input');
  var timeout = null;
  
  textarea.addEventListener('input', function() {
    clearTimeout(timeout);
    timeout = setTimeout(renderDiagram, 1000);
  });
}

function renderDiagram() {
  var code = document.getElementById('code-input').value.trim();
  var output = document.getElementById('diagram-output');
  
  if (!code) {
    output.innerHTML = '<div class="welcome-message">Enter WaveDrom JSON to render</div>';
    return;
  }
  
  try {
    var wavedata;
    try {
      wavedata = JSON.parse(code);
    } catch(e) {
      wavedata = eval('(' + code + ')');
    }
    
    output.innerHTML = '';
    
    var script = document.createElement('script');
    script.type = 'WaveDrom';
    script.textContent = JSON.stringify(wavedata);
    output.appendChild(script);
    
    console.log('Processing WaveDrom...');
    WaveDrom.ProcessAll();
    
    setTimeout(function() {
      console.log('Applying custom styling...');
      if (autoStyleEnabled && typeof window.applyCustomStyling === 'function') {
        window.applyCustomStyling();
        if (typeof window.setupAutoStyling === 'function') {
          window.setupAutoStyling();
        }
      }
    }, 100);
    
    console.log('Diagram rendered');
    
  } catch(e) {
    console.error('Render error:', e);
    output.innerHTML = '<div class="error">Error rendering diagram:<br><br>' + e.message + '</div>';
  }
}

function clearEditor() {
  document.getElementById('code-input').value = '';
  document.getElementById('diagram-output').innerHTML = '<div class="welcome-message">Editor cleared</div>';
  document.getElementById('current-file').textContent = 'No file loaded';
  currentPath = null;
}

function downloadSVG() {
  var svg = document.querySelector('#diagram-output svg');
  if (!svg) {
    alert('No diagram to download. Render a diagram first.');
    return;
  }
  
  var svgData = new XMLSerializer().serializeToString(svg);
  var blob = new Blob([svgData], {type: 'image/svg+xml'});
  var url = URL.createObjectURL(blob);
  
  var a = document.createElement('a');
  a.href = url;
  a.download = (currentPath ? currentPath.replace('.json', '') : 'diagram') + '.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setupResizablePanes() {
  var handle = document.getElementById('resize-handle');
  var leftPane = document.getElementById('code-editor');
  var container = document.getElementById('workspace');
  var isResizing = false;
  
  if(!handle || !leftPane || !container) return;
  
  handle.addEventListener('mousedown', function(e) {
    isResizing = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  
  document.addEventListener('mousemove', function(e) {
    if (!isResizing) return;
    
    var containerRect = container.getBoundingClientRect();
    var newWidth = e.clientX - containerRect.left;
    var percentage = (newWidth / containerRect.width) * 100;
    
    if (percentage > 20 && percentage < 80) {
      leftPane.style.width = percentage + '%';
    }
  });
  
  document.addEventListener('mouseup', function() {
    if (isResizing) {
      isResizing = false;
      document.body.style.cursor = 'default';
      document.body.style.userSelect = 'auto';
    }
  });
}

</script>
</body>
</html>
