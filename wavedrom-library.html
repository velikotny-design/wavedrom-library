<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WaveDrom Library & Editor</title>
<script src="https://wavedrom.com/skins/default.js" type="text/javascript"></script>
<script src="https://wavedrom.com/wavedrom.min.js" type="text/javascript"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 280px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 15px;
    flex-shrink: 0;
  }
  #sidebar h2 {
    font-size: 18px;
    margin-bottom: 15px;
    color: #333;
  }
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 12px;
    margin-bottom: 5px;
    font-size: 14px;
  }
  .file {
    padding: 6px 10px;
    margin: 2px 0;
    margin-left: 8px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    font-size: 13px;
    transition: all 0.2s;
  }
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  .version {
    font-size: 10px;
    color: #999;
    margin-top: 15px;
    text-align: center;
  }
  .loading {
    color: #2196F3;
    font-style: italic;
    padding: 10px;
  }
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
    margin: 10px 0;
    font-size: 13px;
  }
  #editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    background: #2196F3;
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  #header h1 {
    font-size: 18px;
    font-weight: 500;
  }
  #header .controls {
    display: flex;
    gap: 10px;
  }
  #header button {
    padding: 6px 16px;
    background: white;
    color: #2196F3;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  #header button:hover {
    background: #f0f0f0;
  }
  #workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #code-editor {
    width: 50%;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #ddd;
  }
  #code-editor textarea {
    flex: 1;
    padding: 15px;
    font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
    font-size: 13px;
    border: none;
    resize: none;
    outline: none;
    background: #1e1e1e;
    color: #d4d4d4;
  }
  #diagram-viewer {
    width: 50%;
    overflow: auto;
    background: white;
    padding: 20px;
  }
  #diagram-output {
    min-height: 100%;
  }
  .welcome-message {
    text-align: center;
    color: #999;
    padding: 60px 20px;
    font-size: 16px;
  }
  .status {
    padding: 8px 15px;
    background: #fff3cd;
    border-top: 1px solid #ffc107;
    font-size: 12px;
    color: #856404;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  <div class="loading">Loading files...</div>
</div>

<div id="editor-container">
  <div id="header">
    <h1 id="current-file">Select a file to start</h1>
    <div class="controls">
      <button onclick="renderDiagram()">🔄 Render</button>
      <button onclick="downloadSVG()">💾 Save SVG</button>
      <button onclick="clearEditor()">🗑️ Clear</button>
    </div>
  </div>
  
  <div id="workspace">
    <div id="code-editor">
      <textarea id="code-input" placeholder="Load a file or paste WaveDrom JSON here..."></textarea>
    </div>
    
    <div id="diagram-viewer">
      <div id="diagram-output">
        <div class="welcome-message">
          👈 Select a file from the sidebar to view and edit
        </div>
      </div>
    </div>
  </div>
  
  <div id="status" class="status" style="display: none;"></div>
</div>

<script>
var REPO_OWNER = 'velikotny-design';
var REPO_NAME = 'wavedrom-library';
var BRANCH = 'main';
var currentPath = null;
var autoStyleEnabled = true;
var isApplying = false;

window.onload = function() {
  loadFileList();
  setupAutoRender();
};

function loadFileList() {
  var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/git/trees/' + BRANCH + '?recursive=1';
  
  fetch(apiUrl, {cache: 'no-cache'})
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load repository');
      return res.json();
    })
    .then(function(data) {
      var jsonFiles = data.tree.filter(function(item) {
        return item.type === 'blob' && 
               item.path.endsWith('.json') && 
               item.path !== 'package.json';
      });
      
      renderFileTree(jsonFiles);
    })
    .catch(function(err) {
      document.getElementById('sidebar').innerHTML = 
        '<h2>📚 WaveDrom Library</h2><div class="error">Error: ' + err.message + '</div>';
    });
}

function renderFileTree(files) {
  var tree = {};
  
  files.forEach(function(file) {
    var parts = file.path.split('/');
    var folder = parts.length > 1 ? parts[0] : 'root';
    if (!tree[folder]) tree[folder] = [];
    tree[folder].push(file.path);
  });
  
  var sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h2>📚 WaveDrom Library</h2>';
  
  Object.keys(tree).sort().forEach(function(folder) {
    var folderDiv = document.createElement('div');
    folderDiv.className = 'folder';
    folderDiv.textContent = '📁 ' + folder;
    sidebar.appendChild(folderDiv);
    
    tree[folder].sort().forEach(function(path) {
      var filename = path.split('/').pop();
      var fileDiv = document.createElement('div');
      fileDiv.className = 'file';
      fileDiv.textContent = '📄 ' + filename;
      fileDiv.onclick = function() {
        loadFile(path);
        document.querySelectorAll('.file').forEach(function(f) {
          f.classList.remove('active');
        });
        fileDiv.classList.add('active');
      };
      sidebar.appendChild(fileDiv);
    });
  });
  
  var versionDiv = document.createElement('div');
  versionDiv.className = 'version';
  versionDiv.textContent = files.length + ' files loaded';
  sidebar.appendChild(versionDiv);
}

function showStatus(message, isError) {
  var statusDiv = document.getElementById('status');
  if (!statusDiv) return;
  
  statusDiv.textContent = message;
  statusDiv.style.display = 'block';
  statusDiv.style.background = isError ? '#ffebee' : '#fff3cd';
  statusDiv.style.color = isError ? '#c62828' : '#856404';
  statusDiv.style.borderTop = '1px solid ' + (isError ? '#ef5350' : '#ffc107');
  
  setTimeout(function() {
    statusDiv.style.display = 'none';
  }, 3000);
}

function loadFile(path) {
  currentPath = path;
  document.getElementById('current-file').textContent = path;
  showStatus('Loading ' + path + '...');
  
  var rawUrl = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/' + BRANCH + '/' + path;
  
  fetch(rawUrl + '?nocache=' + Date.now())
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load file');
      return res.text();
    })
    .then(function(content) {
      document.getElementById('code-input').value = content;
      showStatus('Loaded ' + path);
      renderDiagram();
    })
    .catch(function(err) {
      showStatus('Error: ' + err.message, true);
    });
}

function setupAutoRender() {
  var textarea = document.getElementById('code-input');
  var timeout = null;
  
  textarea.addEventListener('input', function() {
    clearTimeout(timeout);
    timeout = setTimeout(renderDiagram, 1000);
  });
}

function renderDiagram() {
  var code = document.getElementById('code-input').value.trim();
  var output = document.getElementById('diagram-output');
  
  if (!code) {
    output.innerHTML = '<div class="welcome-message">Enter WaveDrom JSON to render</div>';
    return;
  }
  
  try {
    var wavedata;
    try {
      wavedata = JSON.parse(code);
    } catch(e) {
      wavedata = eval('(' + code + ')');
    }
    
    output.innerHTML = '';
    
    var script = document.createElement('script');
    script.type = 'WaveDrom';
    script.textContent = JSON.stringify(wavedata);
    output.appendChild(script);
    
    console.log('Processing WaveDrom...');
    WaveDrom.ProcessAll();
    
    setTimeout(function() {
      console.log('Applying custom styling...');
      if (autoStyleEnabled) {
        applyCustomStyling();
        setupAutoStyling();
      }
    }, 700);
    
    console.log('Diagram rendered');
    
  } catch(e) {
    console.error('Render error:', e);
    output.innerHTML = '<div class="error">Error rendering diagram:<br><br>' + e.message + '</div>';
  }
}

function clearEditor() {
  document.getElementById('code-input').value = '';
  document.getElementById('diagram-output').innerHTML = '<div class="welcome-message">Editor cleared</div>';
  document.getElementById('current-file').textContent = 'No file loaded';
  currentPath = null;
}

function downloadSVG() {
  var svg = document.querySelector('#diagram-output svg');
  if (!svg) {
    alert('No diagram to download. Render a diagram first.');
    return;
  }
  
  var svgData = new XMLSerializer().serializeToString(svg);
  var blob = new Blob([svgData], {type: 'image/svg+xml'});
  var url = URL.createObjectURL(blob);
  
  var a = document.createElement('a');
  a.href = url;
  a.download = (currentPath ? currentPath.replace('.json', '') : 'diagram') + '.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function applyCustomStyling() {
  if(isApplying) return;
  isApplying = true;
  
  if(window._wavedromObserver) {
    window._wavedromObserver.disconnect();
  }
  
  document.querySelectorAll('svg text.info').forEach(function(el){el.style.fontSize='16px'});
  document.querySelectorAll('svg text.info').forEach(function(el){el.style.fontWeight='normal'});
  document.querySelectorAll('svg text[y="15"][text-anchor="middle"]').forEach(function(el){
    el.style.fontSize='14px';
    el.style.fontWeight='normal';
  });
  document.querySelectorAll('#wavearcs_0 > g > text').forEach(function(el){
    if(el.textContent.length>1) el.style.fontSize='14px';
  });
  document.querySelectorAll('g[id^="wavelane_"] text[text-anchor="middle"]').forEach(function(el){
    if(el.textContent.trim().length===1) el.style.fontSize='4px';
  });
  
  setTimeout(function(){
    var wavearcs = document.getElementById('wavearcs_0');
    if(!wavearcs) {
      isApplying = false;
      reconnectObserver();
      return;
    }
    
    var groups = Array.from(wavearcs.children);
    var lineGroups = [];
    var textGroups = [];
    
    groups.forEach(function(group) {
      if(group.querySelector('text')) {
        textGroups.push(group);
      } else {
        lineGroups.push(group);
      }
    });
    
    lineGroups.forEach(function(g){ wavearcs.appendChild(g); });
    textGroups.forEach(function(g){ wavearcs.appendChild(g); });
    
    document.querySelectorAll('#wavearcs_0 > g > text').forEach(function(el){
      var originalText = el.textContent;
      
      var leadingWhitespace = (originalText.match(/^\s+/) || [''])[0];
      var trailingWhitespace = (originalText.match(/\s+$/) || [''])[0];
      var trimmedText = originalText.trim();
      
      if(trimmedText.length > 1){
        var parent = el.parentNode;
        parent.querySelectorAll('rect').forEach(function(r){ r.remove(); });
        
        var leadingChars = (trimmedText.match(/^[\.\+]+/) || [''])[0];
        var leadingDots = (leadingChars.match(/\./g) || []).length;
        var leadingPlus = (leadingChars.match(/\+/g) || []).length;
        
        var trailingChars = (trimmedText.match(/[\.\+]+$/) || [''])[0];
        var trailingDots = (trailingChars.match(/\./g) || []).length;
        var trailingPlus = (trailingChars.match(/\+/g) || []).length;
        
        var pixelsPerDot = 8;
        var pixelsPerPlus = 6;
        var xShift = (leadingDots - trailingDots) * pixelsPerDot;
        var yShift = (leadingPlus - trailingPlus) * pixelsPerPlus;
        
        var cleanText = trimmedText;
        cleanText = cleanText.replace(/^[\.\+]+/, '');
        cleanText = cleanText.replace(/[\.\+]+$/, '');
        
        el.textContent = leadingWhitespace + cleanText + trailingWhitespace;
        el.style.fill = 'green';
        
        var bbox = el.getBBox();
        
        var rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
        rect.setAttribute('class', 'label-box');
        var paddingX = 4;
        var paddingY = 2;
        var baseYOffset = 3;
        
        rect.setAttribute('x', bbox.x + xShift - paddingX);
        rect.setAttribute('y', bbox.y - paddingY + baseYOffset - yShift);
        rect.setAttribute('width', bbox.width + paddingX*2);
        rect.setAttribute('height', bbox.height + paddingY*2);
        rect.setAttribute('fill','white');
        rect.setAttribute('fill-opacity','1.0');
        rect.setAttribute('rx','1');
        rect.setAttribute('ry','1');
        
        parent.insertBefore(rect,el);
        
        if(!el.hasAttribute('data-custom-styled')) {
          var currentX = parseFloat(el.getAttribute('x')) || 0;
          el.setAttribute('x', currentX + xShift);
          
          var currentY = parseFloat(el.getAttribute('y')) || 0;
          el.setAttribute('y', currentY + baseYOffset - yShift);
          
          el.setAttribute('data-custom-styled', 'true');
        }
      }
    });
    
    setTimeout(function() {
      document.querySelectorAll('#wavearcs_0 > g').forEach(function(group) {
        var rects = group.querySelectorAll('rect');
        if(rects.length > 1) {
          rects.forEach(function(rect) {
            if(!rect.classList.contains('label-box')) {
              rect.remove();
            }
          });
        }
      });
      
      isApplying = false;
      reconnectObserver();
      
    }, 100);
    
  }, 600);
}

function reconnectObserver() {
  var target = document.getElementById('diagram-output');
  if(target && window._wavedromObserver) {
    window._wavedromObserver.observe(target, {
      childList: true,
      subtree: true
    });
  }
}

function setupAutoStyling() {
  var target = document.getElementById('diagram-output');
  if(!target) return;
  
  if(window._wavedromObserver) {
    window._wavedromObserver.disconnect();
  }
  
  var timeout = null;
  window._wavedromObserver = new MutationObserver(function(mutations) {
    var hasRealChanges = mutations.some(function(m) {
      return Array.from(m.addedNodes).some(function(n) {
        return n.tagName === 'svg' || n.tagName === 'SCRIPT';
      });
    });
    
    if(hasRealChanges && !isApplying) {
      clearTimeout(timeout);
      timeout = setTimeout(applyCustomStyling, 800);
    }
  });
  
  reconnectObserver();
  console.log('✓ Auto-styling monitor active');
}

</script>
</body>
</html>
