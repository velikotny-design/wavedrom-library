<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Library</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  
  #sidebar {
    width: 300px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 20px;
  }
  
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
  }
  
  .file {
    padding: 8px 12px;
    margin: 3px 0;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  #viewer {
    margin-top: 20px;
  }
  
  .buttons {
    margin: 20px 0;
  }
  
  button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  
  button:hover {
    background: #45a049;
  }
  
  #codeBox {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    display: none;
    margin-top: 10px;
  }
  
  h1 {
    margin-top: 0;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    margin-top: 50px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  
  <div class="folder">📁 memory/</div>
  <div class="file" onclick="loadWaveform('memory/read_timing')">
    📄 read_timing.json
  </div>
  
  <div class="folder">📁 clock/</div>
  <div class="file" onclick="loadWaveform('clock/basic')">
    📄 basic.json
  </div>
  <div class="file" onclick="loadWaveform('clock/gated')">
    📄 gated.json
  </div>
  
  <div class="folder">📁 handshake/</div>
  <div class="file" onclick="loadWaveform('handshake/two_phase')">
    📄 two_phase.json
  </div>
</div>

<div id="content">
  <h1 id="title">Select a waveform to view</h1>
  
  <div class="buttons" id="buttons" style="display: none;">
    <button onclick="showCode()">Show Code</button>
    <button onclick="window.open('https://wavedrom.com/editor.html', '_blank')">Open in Editor</button>
    <button onclick="downloadSVG()">Download SVG</button>
  </div>
  
  <textarea id="codeBox"></textarea>
  
  <div id="viewer">
    <div class="empty-state">👈 Click a file from the sidebar to view its waveform</div>
  </div>
</div>

<script>
// Store all your waveforms here
var waveforms = {
  'memory/read_timing': {
    signal: [
      {},
      {name: "BL", wave: "01....0....1..", node: ".j............."}, {},
      {name: "BLdiff", wave: "10........1...", node: ".k............."}, {},
      {name: "BLpch_b", wave: "0.1........0..", node: "..a........h...."}, {},
      {name: "rcs", wave: "0.1.......0...", node: "..c.......f...."}, {},
      {name: "WL", wave: "0..1.....0....", node: "...b.....g....."}, {},
      {name: "colpch_b", wave: "0.1........0..", node: "..d........e........."}, {},
      {name: "Saout", wave: "1.......0.....", node: "........i............"}, {},
      {name: "gbpch_b", wave: "0..1.......0..", node: "...l............"}, {},
      {name: "gbl", wave: "0...1........0", node: "....m............"}, {}
    ],
    edge: [
      "a-~b ..++++++r1 pp",
      "c~b r1a raw unmatched......",
      "d~b r1b pp (rcs)",
      "e~g r2b**",
      "e~-f ++++r2b,r27y",
      "h-~g ++++++r2 ",
      "f~-h ..r2c",
      "i~-g r4 90% bf wl/rcs/pch+++..",
      "j-~a +++r7",
      "k~a r7x",
      "l~m r19"
    ],
    head: {text: "READ"},
    foot: {text: "*pp = power & performance, **earliest rcs/wl "}
  },
  
  'clock/basic': {
    signal: [
      {name: "clk", wave: "p......."},
      {name: "data", wave: "x.345x..", data: ["A", "B", "C"]}
    ]
  },
  
  'clock/gated': {
    signal: [
      {name: "clk", wave: "p......."},
      {name: "enable", wave: "01....0."},
      {name: "gated_clk", wave: "p.1010.."}
    ]
  },
  
  'handshake/two_phase': {
    signal: [
      {name: "req", wave: "01.0.1.0"},
      {name: "ack", wave: "0.1.0.1."}
    ]
  }
};

var currentWaveform = null;
var currentName = null;

function loadWaveform(name) {
  currentName = name;
  currentWaveform = waveforms[name];
  
  // Update title
  document.getElementById('title').textContent = name + '.json';
  
  // Show buttons
  document.getElementById('buttons').style.display = 'block';
  
  // Clear viewer
  var viewer = document.getElementById('viewer');
  viewer.innerHTML = '<div id="wave"></div>';
  
  // Render waveform
  WaveDrom.RenderWaveForm(0, currentWaveform, "wave");
  
  // Update active file in sidebar
  var files = document.querySelectorAll('.file');
  files.forEach(function(f) { f.classList.remove('active'); });
  event.target.classList.add('active');
  
  // Hide code box
  document.getElementById('codeBox').style.display = 'none';
}

function showCode() {
  var box = document.getElementById('codeBox');
  box.value = JSON.stringify(currentWaveform, null, 2);
  box.style.display = 'block';
  box.select();
}

function downloadSVG() {
  var svg = document.querySelector('#wave svg');
  if (svg) {
    var svgData = new XMLSerializer().serializeToString(svg);
    var blob = new Blob([svgData], {type: 'image/svg+xml'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = currentName.replace('/', '_') + '.svg';
    link.click();
  }
}
</script>

</body>
</html>
