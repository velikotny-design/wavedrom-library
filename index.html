<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Library</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  
  #sidebar {
    width: 300px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 20px;
  }
  
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
  }
  
  .file {
    padding: 8px 12px;
    margin: 3px 0;
    margin-left: 10px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  .buttons {
    margin: 20px 0;
  }
  
  button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  
  button:hover {
    background: #45a049;
  }
  
  #codeBox {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    margin-top: 10px;
  }
  
  h1 {
    margin-top: 0;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    margin-top: 50px;
    text-align: center;
  }
  
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  
  <!-- MANUAL FILE LIST - Edit this section to add your files -->
  
  <div class="folder">📁 memory/</div>
  <div class="file" onclick="loadWave('memory/read_timing.json')">
    📄 read_timing.json
  </div>
  
  <div class="folder">📁 clock/</div>
  <div class="file" onclick="loadWave('clock/basic.json')">
    📄 basic.json
  </div>
  
  <!-- Add more files here as needed -->
  
</div>

<div id="content">
  <h1 id="title">Select a waveform</h1>
  
  <div class="buttons" id="buttons" style="display: none;">
    <button onclick="showCode()">Show Code</button>
    <button onclick="openEditor()">Open in Editor</button>
  </div>
  
  <textarea id="codeBox" style="display: none;"></textarea>
  
  <div id="viewer">
    <div class="empty-state">👈 Click a file to view</div>
  </div>
  
  <div id="error" style="display: none;"></div>
</div>

<script>
var currentCode = null;

function loadWave(path) {
  console.log('Loading:', path);
  
  document.getElementById('title').textContent = 'Loading ' + path + '...';
  document.getElementById('viewer').innerHTML = '<div>Loading...</div>';
  document.getElementById('buttons').style.display = 'none';
  document.getElementById('codeBox').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  
  // Clear active state
  var files = document.querySelectorAll('.file');
  files.forEach(function(f) { f.classList.remove('active'); });
  event.target.classList.add('active');
  
  // Fetch the file
  fetch(path)
    .then(function(response) {
      console.log('Response status:', response.status);
      if (!response.ok) throw new Error('File not found');
      return response.text();
    })
    .then(function(text) {
      console.log('Loaded:', text.substring(0, 50));
      currentCode = text;
      
      // Parse JSON
      var waveform;
      try {
        waveform = JSON.parse(text);
      } catch(e) {
        waveform = eval('(' + text + ')');
      }
      
      // Render
      document.getElementById('title').textContent = path;
      document.getElementById('viewer').innerHTML = '<div id="wave"></div>';
      document.getElementById('buttons').style.display = 'block';
      
      WaveDrom.RenderWaveForm(0, waveform, 'wave');
    })
    .catch(function(error) {
      console.error('Error:', error);
      document.getElementById('title').textContent = 'Error';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').className = 'error';
      document.getElementById('error').textContent = 'Error loading ' + path + ': ' + error.message;
    });
}

function showCode() {
  var box = document.getElementById('codeBox');
  if (currentCode) {
    box.value = currentCode;
    box.style.display = 'block';
    box.select();
  }
}

function openEditor() {
  if (currentCode) {
    navigator.clipboard.writeText(currentCode).then(function() {
      alert('Code copied! Opening editor - paste with Cmd+V');
      window.open('https://wavedrom.com/editor.html', '_blank');
    }).catch(function() {
      showCode();
      alert('Copy the code above, then click OK to open editor');
      window.open('https://wavedrom.com/editor.html', '_blank');
    });
  }
}

console.log('Script loaded');
</script>

</body>
</html>
