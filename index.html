<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Library</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  
  #sidebar {
    width: 300px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 20px;
  }
  
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
  }
  
  .file {
    padding: 8px 12px;
    margin: 3px 0;
    margin-left: 10px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  #viewer {
    margin-top: 20px;
  }
  
  .buttons {
    margin: 20px 0;
  }
  
  button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  
  button:hover {
    background: #45a049;
  }
  
  #codeBox {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    display: none;
    margin-top: 10px;
  }
  
  h1 {
    margin-top: 0;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    margin-top: 50px;
    text-align: center;
  }
  
  .loading {
    color: #2196F3;
    font-style: italic;
  }
  
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
    margin-top: 10px;
  }
  
  .success {
    color: #4CAF50;
    padding: 10px;
    background: #e8f5e9;
    border-radius: 4px;
    margin-top: 10px;
  }
  
  .nested {
    margin-left: 20px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  <div class="loading">Scanning repository...</div>
</div>

<div id="content">
  <h1 id="title">WaveDrom Library Browser</h1>
  
  <div class="success">
    <strong>✨ Fully Automatic</strong><br>
    - Discovers all .json files automatically<br>
    - Scans all directories recursively<br>
    - Just add files and refresh!
  </div>
  
  <div class="buttons" id="buttons" style="display: none;">
    <button onclick="showCode()">Show Code</button>
    <button onclick="window.open('https://wavedrom.com/editor.html', '_blank')">Open in Editor</button>
    <button onclick="downloadSVG()">Download SVG</button>
    <button onclick="window.open(currentFilePath, '_blank')">View Raw JSON</button>
  </div>
  
  <textarea id="codeBox"></textarea>
  
  <div id="viewer">
    <div class="empty-state">👈 Click a file from the sidebar to view its waveform</div>
  </div>
</div>

<script>
var currentWaveform = null;
var currentName = null;
var currentFilePath = null;
var currentRawCode = null;
var repoOwner = '';
var repoName = '';

// Initialize: Auto-discover everything
function initLibrary() {
  // Detect if we're on GitHub Pages
  var isGitHubPages = window.location.hostname.includes('github.io');
  
  if (isGitHubPages) {
    // Extract repo info from URL
    // Format: username.github.io/repo-name/
    var parts = window.location.pathname.split('/').filter(function(p) { return p; });
    repoOwner = window.location.hostname.split('.')[0];
    repoName = parts[0] || repoOwner; // fallback to owner if no repo name
    
    console.log('Detected GitHub Pages: ' + repoOwner + '/' + repoName);
    
    // Scan the repository root
    scanGitHubDirectory('', function(tree) {
      renderTree(tree);
    });
  } else {
    // Local development mode
    document.getElementById('sidebar').innerHTML = 
      '<h2>📚 WaveDrom Library</h2>' +
      '<div class="error">' +
      '<strong>⚠️ Local Mode</strong><br>' +
      'Auto-discovery only works on GitHub Pages.<br><br>' +
      'Deploy to GitHub Pages or add files manually below.' +
      '</div>';
  }
}

// Scan GitHub directory recursively
function scanGitHubDirectory(path, callback) {
  var apiUrl = 'https://api.github.com/repos/' + repoOwner + '/' + repoName + '/contents/' + path;
  
  fetch(apiUrl)
    .then(function(response) {
      if (!response.ok) throw new Error('Cannot access repo');
      return response.json();
    })
    .then(function(items) {
      var tree = {folders: {}, files: []};
      var pending = 0;
      var processed = 0;
      
      // First pass: identify files and folders
      items.forEach(function(item) {
        // Skip hidden files and index.html
        if (item.name.startsWith('.') || item.name === 'index.html') {
          return;
        }
        
        if (item.type === 'file' && item.name.endsWith('.json')) {
          tree.files.push({
            name: item.name,
            path: item.path
          });
        } else if (item.type === 'dir') {
          pending++;
          scanGitHubDirectory(item.path, function(subTree) {
            tree.folders[item.name] = subTree;
            processed++;
            if (processed === pending) {
              callback(tree);
            }
          });
        }
      });
      
      // If no subdirectories, callback immediately
      if (pending === 0) {
        callback(tree);
      }
    })
    .catch(function(error) {
      console.error('Error scanning ' + path + ':', error);
      callback({folders: {}, files: []});
    });
}

// Render the tree structure in sidebar
function renderTree(tree, parentElement, basePath) {
  if (!parentElement) {
    parentElement = document.getElementById('sidebar');
    parentElement.innerHTML = '<h2>📚 WaveDrom Library</h2>';
  }
  
  if (!basePath) {
    basePath = '';
  }
  
  var totalFiles = 0;
  
  // Render folders (sorted alphabetically)
  var folderNames = Object.keys(tree.folders).sort();
  folderNames.forEach(function(folderName) {
    var folderDiv = document.createElement('div');
    folderDiv.className = 'folder';
    folderDiv.textContent = '📁 ' + folderName + '/';
    parentElement.appendChild(folderDiv);
    
    var containerDiv = document.createElement('div');
    containerDiv.className = 'nested';
    parentElement.appendChild(containerDiv);
    
    var subTree = tree.folders[folderName];
    var count = renderTree(subTree, containerDiv, basePath + folderName + '/');
    totalFiles += count;
  });
  
  // Render files (sorted alphabetically)
  tree.files.sort(function(a, b) {
    return a.name.localeCompare(b.name);
  });
  
  tree.files.forEach(function(file) {
    var fileDiv = document.createElement('div');
    fileDiv.className = 'file';
    fileDiv.textContent = '📄 ' + file.name;
    fileDiv.onclick = function(e) {
      loadWaveform(file.path, e.target);
    };
    parentElement.appendChild(fileDiv);
    totalFiles++;
  });
  
  // Show empty message if no files found
  if (totalFiles === 0 && !basePath) {
    parentElement.innerHTML += '<div class="empty-state">No .json files found in repository</div>';
  }
  
  return totalFiles;
}

function loadWaveform(path, element) {
  currentName = path;
  currentFilePath = path;
  
  // Update title
  document.getElementById('title').innerHTML = '<span class="loading">Loading ' + path + '...</span>';
  
  // Clear viewer
  var viewer = document.getElementById('viewer');
  viewer.innerHTML = '<div class="loading">Loading waveform...</div>';
  
  // Hide buttons and code
  document.getElementById('buttons').style.display = 'none';
  document.getElementById('codeBox').style.display = 'none';
  
  // Fetch the JSON file
  fetch(path)
    .then(function(response) {
      if (!response.ok) {
        throw new Error('File not found: ' + path);
      }
      return response.text();
    })
    .then(function(text) {
      // Store raw code
      currentRawCode = text;
      
      // Parse JSON (try strict first, then relaxed)
      try {
        currentWaveform = JSON.parse(text);
      } catch(e) {
        // Try eval for relaxed WaveDrom syntax
        try {
          currentWaveform = eval('(' + text + ')');
        } catch(e2) {
          throw new Error('Invalid JSON format: ' + e2.message);
        }
      }
      
      // Update title
      document.getElementById('title').textContent = path;
      
      // Show buttons
      document.getElementById('buttons').style.display = 'block';
      
      // Clear and render
      viewer.innerHTML = '<div id="wave"></div>';
      WaveDrom.RenderWaveForm(0, currentWaveform, "wave");
      
      // Update active file in sidebar
      var files = document.querySelectorAll('.file');
      files.forEach(function(f) { f.classList.remove('active'); });
      if (element) {
        element.classList.add('active');
      }
    })
    .catch(function(error) {
      viewer.innerHTML = '<div class="error">❌ Error loading waveform: ' + error.message + '</div>';
      document.getElementById('title').textContent = 'Error';
    });
}

function showCode() {
  var box = document.getElementById('codeBox');
  box.value = currentRawCode;
  box.style.display = 'block';
  box.select();
}

function downloadSVG() {
  var svg = document.querySelector('#wave svg');
  if (svg) {
    var svgData = new XMLSerializer().serializeToString(svg);
    var blob = new Blob([svgData], {type: 'image/svg+xml'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = currentName.replace(/\//g, '_').replace('.json', '.svg');
    link.click();
  }
}

// Initialize on page load
window.onload = function() {
  initLibrary();
};
</script>

</body>
</html>
