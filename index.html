<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Library</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  
  #sidebar {
    width: 300px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 20px;
  }
  
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
  }
  
  .file {
    padding: 8px 12px;
    margin: 3px 0;
    margin-left: 10px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  .buttons {
    margin: 20px 0;
  }
  
  button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  
  button:hover {
    background: #45a049;
  }
  
  #codeBox {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    margin-top: 10px;
  }
  
  h1 {
    margin-top: 0;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    margin-top: 50px;
    text-align: center;
  }
  
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
  }
  
  .warning {
    color: #ff9800;
    padding: 10px;
    background: #fff3e0;
    border-radius: 4px;
    margin-top: 10px;
  }
  
  .loading {
    color: #2196F3;
    font-style: italic;
  }
  
  .version {
    font-size: 10px;
    color: #999;
    margin-top: 10px;
  }
  
  .debug-box {
    background: #f5f5f5;
    padding: 10px;
    margin-top: 10px;
    font-family: monospace;
    font-size: 11px;
    border: 1px solid #ddd;
    max-height: 300px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  <div class="loading">Scanning...</div>
  <div class="version">v1.1</div>
</div>

<div id="content">
  <h1 id="title">Select a waveform</h1>
  
  <div class="buttons" id="buttons" style="display: none;">
    <button onclick="showCode()">Show Code</button>
    <button onclick="openEditor()">Open in Editor</button>
    <button onclick="validateJSON()">Validate JSON</button>
  </div>
  
  <textarea id="codeBox" style="display: none;"></textarea>
  
  <div id="viewer">
    <div class="empty-state">👈 Click a file to view</div>
  </div>
  
  <div id="error" style="display: none;"></div>
</div>

<script>
var currentCode = null;
var currentWaveform = null;
var SCRIPT_VERSION = '1.1';

// Clear cache on load
function clearCache() {
  var cachedVersion = localStorage.getItem('wavedrom_lib_version');
  
  if (cachedVersion !== SCRIPT_VERSION) {
    console.log('Version changed - clearing cache');
    localStorage.setItem('wavedrom_lib_version', SCRIPT_VERSION);
    
    if (!sessionStorage.getItem('cache_cleared')) {
      sessionStorage.setItem('cache_cleared', 'true');
      window.location.reload(true);
      return false;
    }
  }
  
  return true;
}

// Auto-discover files on GitHub Pages
function init() {
  if (!clearCache()) return;
  
  console.log('Initializing...');
  
  var pathParts = window.location.pathname.split('/').filter(function(p) { return p && p !== 'index.html'; });
  var owner = window.location.hostname.split('.')[0];
  var repo = pathParts[0];
  
  console.log('Owner:', owner, 'Repo:', repo);
  
  if (!repo) {
    showManual();
    return;
  }
  
  var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/main?recursive=1';
  
  fetch(apiUrl)
    .then(function(res) {
      if (!res.ok) throw new Error('API failed: ' + res.status);
      return res.json();
    })
    .then(function(data) {
      var jsonFiles = data.tree.filter(function(item) {
        return item.type === 'blob' && 
               item.path.endsWith('.json') && 
               item.path !== 'package.json' &&
               !item.path.includes('node_modules');
      });
      
      console.log('Found', jsonFiles.length, 'JSON files');
      
      var tree = {};
      jsonFiles.forEach(function(file) {
        var parts = file.path.split('/');
        var folder = parts.length > 1 ? parts[0] : 'root';
        
        if (!tree[folder]) {
          tree[folder] = [];
        }
        tree[folder].push(file.path);
      });
      
      var sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '<h2>📚 WaveDrom Library</h2>';
      
      var folders = Object.keys(tree).sort();
      folders.forEach(function(folder) {
        var folderDiv = document.createElement('div');
        folderDiv.className = 'folder';
        folderDiv.textContent = '📁 ' + folder + '/';
        sidebar.appendChild(folderDiv);
        
        tree[folder].sort().forEach(function(path) {
          var filename = path.split('/').pop();
          var fileDiv = document.createElement('div');
          fileDiv.className = 'file';
          fileDiv.textContent = '📄 ' + filename;
          fileDiv.onclick = function() {
            loadWave(path, fileDiv);
          };
          sidebar.appendChild(fileDiv);
        });
      });
      
      var versionDiv = document.createElement('div');
      versionDiv.className = 'version';
      versionDiv.textContent = 'v' + SCRIPT_VERSION;
      sidebar.appendChild(versionDiv);
    })
    .catch(function(err) {
      console.error('Error:', err);
      showManual();
    });
}

function showManual() {
  var sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h2>📚 WaveDrom Library</h2>' +
    '<div class="error">Auto-discovery failed.</div>' +
    '<div class="version">v' + SCRIPT_VERSION + '</div>';
}

function loadWave(path, element) {
  console.log('Loading:', path);
  
  document.getElementById('title').textContent = 'Loading ' + path + '...';
  document.getElementById('viewer').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('buttons').style.display = 'none';
  document.getElementById('codeBox').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  
  var files = document.querySelectorAll('.file');
  files.forEach(function(f) { f.classList.remove('active'); });
  if (element) element.classList.add('active');
  
  var cacheBuster = '?t=' + new Date().getTime();
  fetch(path + cacheBuster)
    .then(function(response) {
      console.log('Response status:', response.status);
      if (!response.ok) throw new Error('File not found');
      return response.text();
    })
    .then(function(text) {
      console.log('Loaded', text.length, 'bytes');
      console.log('First 100 chars:', text.substring(0, 100));
      
      currentCode = text;
      
      // Try to parse
      var waveform;
      var parseMethod = '';
      
      try {
        waveform = JSON.parse(text);
        parseMethod = 'JSON.parse';
        console.log('Parsed with JSON.parse');
      } catch(e) {
        console.log('JSON.parse failed:', e.message);
        try {
          waveform = eval('(' + text + ')');
          parseMethod = 'eval';
          console.log('Parsed with eval');
        } catch(e2) {
          throw new Error('Cannot parse JSON: ' + e2.message);
        }
      }
      
      currentWaveform = waveform;
      console.log('Waveform object:', waveform);
      
      // Validate waveform structure
      if (!waveform) {
        throw new Error('Waveform is null or undefined');
      }
      
      if (typeof waveform !== 'object') {
        throw new Error('Waveform is not an object');
      }
      
      if (!waveform.signal && !waveform.reg && !waveform.assign) {
        throw new Error('Waveform has no signal, reg, or assign property');
      }
      
      // Update UI
      document.getElementById('title').textContent = path;
      document.getElementById('buttons').style.display = 'block';
      
      var viewer = document.getElementById('viewer');
      viewer.innerHTML = '<div id="wave"></div>';
      
      // Try to render
      try {
        console.log('Calling WaveDrom.RenderWaveForm...');
        WaveDrom.RenderWaveForm(0, waveform, 'wave');
        console.log('Render complete');
        
        // Show success info
        var info = document.createElement('div');
        info.className = 'warning';
        info.innerHTML = '<strong>✓ Rendered successfully</strong><br>' +
          'Parse method: ' + parseMethod + '<br>' +
          'Signals: ' + (waveform.signal ? waveform.signal.length : 'N/A');
        viewer.appendChild(info);
      } catch(renderError) {
        console.error('Render error:', renderError);
        throw new Error('WaveDrom render failed: ' + renderError.message);
      }
    })
    .catch(function(error) {
      console.error('Error:', error);
      document.getElementById('title').textContent = 'Error';
      
      var errorDiv = document.getElementById('error');
      errorDiv.style.display = 'block';
      errorDiv.className = 'error';
      errorDiv.innerHTML = '<strong>Error loading ' + path + ':</strong><br>' + error.message;
      
      // Show buttons even on error (so user can see code)
      document.getElementById('buttons').style.display = 'block';
      
      // Show debug info
      if (currentCode) {
        var debugDiv = document.createElement('div');
        debugDiv.className = 'debug-box';
        debugDiv.innerHTML = '<strong>File content (first 500 chars):</strong><br>' +
          '<pre>' + currentCode.substring(0, 500).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
        errorDiv.appendChild(debugDiv);
      }
    });
}

function showCode() {
  var box = document.getElementById('codeBox');
  if (currentCode) {
    box.value = currentCode;
    box.style.display = 'block';
    box.select();
  }
}

function validateJSON() {
  if (!currentCode) {
    alert('No file loaded');
    return;
  }
  
  var report = 'JSON Validation Report:\n\n';
  report += 'File size: ' + currentCode.length + ' bytes\n\n';
  
  try {
    var obj = JSON.parse(currentCode);
    report += '✓ Valid strict JSON\n\n';
    report += 'Structure:\n';
    report += JSON.stringify(obj, null, 2);
  } catch(e) {
    report += '✗ Not valid strict JSON: ' + e.message + '\n';
    try {
      var obj2 = eval('(' + currentCode + ')');
      report += '✓ Valid as JavaScript object\n\n';
      report += 'Structure:\n';
      report += JSON.stringify(obj2, null, 2);
    } catch(e2) {
      report += '✗ Also not valid JavaScript: ' + e2.message;
    }
  }
  
  alert(report);
}

function openEditor() {
  if (currentCode) {
    navigator.clipboard.writeText(currentCode).then(function() {
      alert('Code copied! Opening editor - paste with Cmd+V');
      window.open('https://wavedrom.com/editor.html', '_blank');
    }).catch(function() {
      showCode();
      alert('Copy the code above, then click OK to open editor');
      window.open('https://wavedrom.com/editor.html', '_blank');
    });
  }
}

window.onload = init;
console.log('Script loaded v' + SCRIPT_VERSION);
</script>

</body>
</html>
