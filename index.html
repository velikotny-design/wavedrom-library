<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Library</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  
  #sidebar {
    width: 300px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 20px;
  }
  
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
  }
  
  .file {
    padding: 8px 12px;
    margin: 3px 0;
    margin-left: 10px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  #viewer {
    margin-top: 20px;
  }
  
  .buttons {
    margin: 20px 0;
  }
  
  button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  
  button:hover {
    background: #45a049;
  }
  
  #codeBox {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    display: none;
    margin-top: 10px;
  }
  
  h1 {
    margin-top: 0;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    margin-top: 50px;
  }
  
  .loading {
    color: #2196F3;
    font-style: italic;
  }
  
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
    margin-top: 10px;
  }
  
  .success {
    color: #4CAF50;
    padding: 10px;
    background: #e8f5e9;
    border-radius: 4px;
    margin-top: 10px;
  }
  
  .debug-info {
    background: #fff3cd;
    padding: 10px;
    margin-top: 10px;
    font-family: monospace;
    font-size: 11px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  <div class="loading">Initializing...</div>
  <div id="debugInfo" class="debug-info"></div>
</div>

<div id="content">
  <h1 id="title">WaveDrom Library Browser</h1>
  
  <div class="success">
    <strong>✨ Fully Automatic</strong><br>
    - Discovers all .json files automatically<br>
    - Scans all directories recursively<br>
    - Just add files and refresh!
  </div>
  
  <div class="buttons" id="buttons" style="display: none;">
    <button onclick="showCode()">Show Code</button>
    <button onclick="openEditor()">Open in Editor</button>
    <button onclick="downloadSVG()">Download SVG</button>
  </div>
  
  <textarea id="codeBox"></textarea>
  
  <div id="viewer">
    <div class="empty-state">👈 Click a file from the sidebar to view its waveform</div>
  </div>
</div>

<script>
var currentWaveform = null;
var currentRawCode = null;
var repoOwner = '';
var repoName = '';

function log(msg) {
  var debugDiv = document.getElementById('debugInfo');
  debugDiv.innerHTML += msg + '<br>';
  console.log(msg);
}

function initLibrary() {
  log('Starting initialization...');
  
  var hostname = window.location.hostname;
  var pathname = window.location.pathname;
  
  log('Hostname: ' + hostname);
  log('Pathname: ' + pathname);
  
  if (hostname.includes('github.io')) {
    var pathParts = pathname.split('/').filter(function(p) { return p; });
    repoOwner = hostname.split('.')[0];
    repoName = pathParts[0] || '';
    
    log('Detected GitHub Pages');
    log('Owner: ' + repoOwner);
    log('Repo: ' + repoName);
    
    if (!repoName) {
      showError('Cannot detect repository name from URL');
      return;
    }
    
    var apiUrl = 'https://api.github.com/repos/' + repoOwner + '/' + repoName + '/git/trees/main?recursive=1';
    log('API URL: ' + apiUrl);
    
    fetch(apiUrl)
      .then(function(response) {
        log('API Response status: ' + response.status);
        if (!response.ok) {
          throw new Error('API returned ' + response.status);
        }
        return response.json();
      })
      .then(function(data) {
        log('API returned ' + data.tree.length + ' items');
        buildTreeFromAPI(data.tree);
      })
      .catch(function(error) {
        log('ERROR: ' + error.message);
        showError('Failed to scan repository: ' + error.message);
      });
  } else {
    log('Not on GitHub Pages - using manual mode');
    showManualMode();
  }
}

function buildTreeFromAPI(items) {
  var tree = {};
  var jsonFiles = [];
  
  items.forEach(function(item) {
    if (item.type === 'blob' && item.path.endsWith('.json') && 
        item.path !== 'package.json' && 
        !item.path.includes('node_modules')) {
      jsonFiles.push(item.path);
    }
  });
  
  log('Found ' + jsonFiles.length + ' JSON files');
  
  jsonFiles.forEach(function(path) {
    var parts = path.split('/');
    var current = tree;
    
    for (var i = 0; i < parts.length - 1; i++) {
      var folder = parts[i];
      if (!current[folder]) {
        current[folder] = {};
      }
      current = current[folder];
    }
    
    var filename = parts[parts.length - 1];
    if (!current.__files) {
      current.__files = [];
    }
    current.__files.push({name: filename, path: path});
  });
  
  renderTree(tree);
}

function renderTree(tree, parentElement, level) {
  if (!parentElement) {
    parentElement = document.getElementById('sidebar');
    parentElement.innerHTML = '<h2>📚 WaveDrom Library</h2>';
    level = 0;
  }
  
  var folders = Object.keys(tree).filter(function(k) { return k !== '__files'; }).sort();
  
  folders.forEach(function(folder) {
    var folderDiv = document.createElement('div');
    folderDiv.className = 'folder';
    folderDiv.style.marginLeft = (level * 10) + 'px';
    folderDiv.textContent = '📁 ' + folder + '/';
    parentElement.appendChild(folderDiv);
    
    renderTree(tree[folder], parentElement, level + 1);
  });
  
  if (tree.__files) {
    tree.__files.sort(function(a, b) {
      return a.name.localeCompare(b.name);
    });
    
    tree.__files.forEach(function(file) {
      var fileDiv = document.createElement('div');
      fileDiv.className = 'file';
      fileDiv.style.marginLeft = (level * 10 + 10) + 'px';
      fileDiv.textContent = '📄 ' + file.name;
      fileDiv.onclick = function() {
        loadWaveform(file.path);
      };
      parentElement.appendChild(fileDiv);
    });
  }
}

function loadWaveform(path) {
  log('Loading: ' + path);
  
  document.getElementById('title').innerHTML = '<span class="loading">Loading ' + path + '...</span>';
  
  var viewer = document.getElementById('viewer');
  viewer.innerHTML = '<div class="loading">Loading waveform...</div>';
  
  document.getElementById('buttons').style.display = 'none';
  document.getElementById('codeBox').style.display = 'none';
  
  var rawUrl = 'https://raw.githubusercontent.com/' + repoOwner + '/' + repoName + '/main/' + path;
  log('Fetching: ' + rawUrl);
  
  fetch(rawUrl)
    .then(function(response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.text();
    })
    .then(function(text) {
      log('Loaded ' + text.length + ' bytes');
      currentRawCode = text;
      
      try {
        currentWaveform = JSON.parse(text);
      } catch(e) {
        log('JSON parse failed, trying eval');
        try {
          currentWaveform = eval('(' + text + ')');
        } catch(e2) {
          throw new Error('Cannot parse: ' + e2.message);
        }
      }
      
      document.getElementById('title').textContent = path;
      document.getElementById('buttons').style.display = 'block';
      
      viewer.innerHTML = '<div id="wave"></div>';
      
      try {
        WaveDrom.RenderWaveForm(0, currentWaveform, "wave");
        log('Rendered successfully');
      } catch(e) {
        throw new Error('Render failed: ' + e.message);
      }
      
      var files = document.querySelectorAll('.file');
      files.forEach(function(f) { f.classList.remove('active'); });
      event.target.classList.add('active');
    })
    .catch(function(error) {
      log('ERROR: ' + error.message);
      viewer.innerHTML = '<div class="error">❌ ' + error.message + '</div>';
    });
}

function showCode() {
  if (!currentRawCode) return;
  var box = document.getElementById('codeBox');
  box.value = currentRawCode;
  box.style.display = 'block';
  box.select();
}

function openEditor() {
  if (!currentRawCode) return;
  var encoded = encodeURIComponent(currentRawCode);
  window.open('https://wavedrom.com/editor.html#' + encoded, '_blank');
}

function downloadSVG() {
  var svg = document.querySelector('#wave svg');
  if (!svg) return;
  var svgData = new XMLSerializer().serializeToString(svg);
  var blob = new Blob([svgData], {type: 'image/svg+xml'});
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = 'waveform.svg';
  link.click();
}

function showError(msg) {
  document.getElementById('sidebar').innerHTML = 
    '<h2>📚 WaveDrom Library</h2>' +
    '<div class="error">' + msg + '</div>' +
    '<div id="debugInfo" class="debug-info"></div>';
}

function showManualMode() {
  document.getElementById('sidebar').innerHTML = 
    '<h2>📚 WaveDrom Library</h2>' +
    '<div class="error">' +
    '<strong>⚠️ Local Mode</strong><br>' +
    'Auto-discovery only works on GitHub Pages.<br><br>' +
    'Deploy to: https://github.com/settings (enable Pages)' +
    '</div>';
}

window.onload = initLibrary;
</script>

</body>
</html>
