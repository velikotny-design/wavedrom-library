<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Library</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
  }
  
  #sidebar {
    width: 300px;
    background: #f5f5f5;
    border-right: 2px solid #ddd;
    overflow-y: auto;
    padding: 20px;
  }
  
  #content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  
  .folder {
    font-weight: bold;
    color: #0366d6;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
  }
  
  .file {
    padding: 8px 12px;
    margin: 3px 0;
    margin-left: 10px;
    cursor: pointer;
    border-radius: 4px;
    background: white;
    border: 1px solid #ddd;
    transition: all 0.2s;
  }
  
  .file:hover {
    background: #e3f2fd;
    border-color: #2196F3;
  }
  
  .file.active {
    background: #2196F3;
    color: white;
    border-color: #2196F3;
  }
  
  .buttons {
    margin: 20px 0;
  }
  
  button {
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
  }
  
  button:hover {
    background: #45a049;
  }
  
  #codeBox {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    margin-top: 10px;
  }
  
  h1 {
    margin-top: 0;
  }
  
  .empty-state {
    color: #999;
    font-style: italic;
    margin-top: 50px;
    text-align: center;
  }
  
  .error {
    color: #f44336;
    padding: 10px;
    background: #ffebee;
    border-radius: 4px;
  }
  
  .loading {
    color: #2196F3;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>📚 WaveDrom Library</h2>
  <div class="loading">Scanning...</div>
</div>

<div id="content">
  <h1 id="title">Select a waveform</h1>
  
  <div class="buttons" id="buttons" style="display: none;">
    <button onclick="showCode()">Show Code</button>
    <button onclick="openEditor()">Open in Editor</button>
  </div>
  
  <textarea id="codeBox" style="display: none;"></textarea>
  
  <div id="viewer">
    <div class="empty-state">👈 Click a file to view</div>
  </div>
  
  <div id="error" style="display: none;"></div>
</div>

<script>
var currentCode = null;

// Auto-discover files on GitHub Pages
function init() {
  console.log('Initializing...');
  console.log('URL:', window.location.href);
  
  // Extract repo info
  var pathParts = window.location.pathname.split('/').filter(function(p) { return p && p !== 'index.html'; });
  var owner = window.location.hostname.split('.')[0];
  var repo = pathParts[0];
  
  console.log('Owner:', owner);
  console.log('Repo:', repo);
  
  if (!repo) {
    console.error('Cannot detect repo name');
    showManual();
    return;
  }
  
  // Use GitHub API to get file tree
  var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/main?recursive=1';
  console.log('API:', apiUrl);
  
  fetch(apiUrl)
    .then(function(res) {
      console.log('API status:', res.status);
      if (!res.ok) throw new Error('API failed: ' + res.status);
      return res.json();
    })
    .then(function(data) {
      console.log('Got', data.tree.length, 'items');
      
      // Find all .json files
      var jsonFiles = data.tree.filter(function(item) {
        return item.type === 'blob' && 
               item.path.endsWith('.json') && 
               item.path !== 'package.json' &&
               !item.path.includes('node_modules');
      });
      
      console.log('Found', jsonFiles.length, 'JSON files');
      
      // Build tree structure
      var tree = {};
      jsonFiles.forEach(function(file) {
        var parts = file.path.split('/');
        var folder = parts.length > 1 ? parts[0] : 'root';
        
        if (!tree[folder]) {
          tree[folder] = [];
        }
        tree[folder].push(file.path);
      });
      
      // Render sidebar
      var sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '<h2>📚 WaveDrom Library</h2>';
      
      var folders = Object.keys(tree).sort();
      folders.forEach(function(folder) {
        var folderDiv = document.createElement('div');
        folderDiv.className = 'folder';
        folderDiv.textContent = '📁 ' + folder + '/';
        sidebar.appendChild(folderDiv);
        
        tree[folder].sort().forEach(function(path) {
          var filename = path.split('/').pop();
          var fileDiv = document.createElement('div');
          fileDiv.className = 'file';
          fileDiv.textContent = '📄 ' + filename;
          fileDiv.onclick = function() {
            loadWave(path, fileDiv);
          };
          sidebar.appendChild(fileDiv);
        });
      });
    })
    .catch(function(err) {
      console.error('Error:', err);
      showManual();
    });
}

function showManual() {
  var sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h2>📚 WaveDrom Library</h2>' +
    '<div class="error">Auto-discovery failed.<br>Add files manually in the HTML.</div>';
}

function loadWave(path, element) {
  console.log('Loading:', path);
  
  document.getElementById('title').textContent = 'Loading ' + path + '...';
  document.getElementById('viewer').innerHTML = '<div class="loading">Loading...</div>';
  document.getElementById('buttons').style.display = 'none';
  document.getElementById('codeBox').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  
  // Clear active state
  var files = document.querySelectorAll('.file');
  files.forEach(function(f) { f.classList.remove('active'); });
  if (element) element.classList.add('active');
  
  // Fetch the file
  fetch(path)
    .then(function(response) {
      console.log('Response status:', response.status);
      if (!response.ok) throw new Error('File not found');
      return response.text();
    })
    .then(function(text) {
      console.log('Loaded:', text.substring(0, 50));
      currentCode = text;
      
      // Parse JSON
      var waveform;
      try {
        waveform = JSON.parse(text);
      } catch(e) {
        waveform = eval('(' + text + ')');
      }
      
      // Render
      document.getElementById('title').textContent = path;
      document.getElementById('viewer').innerHTML = '<div id="wave"></div>';
      document.getElementById('buttons').style.display = 'block';
      
      WaveDrom.RenderWaveForm(0, waveform, 'wave');
    })
    .catch(function(error) {
      console.error('Error:', error);
      document.getElementById('title').textContent = 'Error';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').className = 'error';
      document.getElementById('error').textContent = 'Error loading ' + path + ': ' + error.message;
    });
}

function showCode() {
  var box = document.getElementById('codeBox');
  if (currentCode) {
    box.value = currentCode;
    box.style.display = 'block';
    box.select();
  }
}

function openEditor() {
  if (currentCode) {
    navigator.clipboard.writeText(currentCode).then(function() {
      alert('Code copied! Opening editor - paste with Cmd+V');
      window.open('https://wavedrom.com/editor.html', '_blank');
    }).catch(function() {
      showCode();
      alert('Copy the code above, then click OK to open editor');
      window.open('https://wavedrom.com/editor.html', '_blank');
    });
  }
}

// Start when page loads
window.onload = init;

console.log('Script loaded');
</script>

</body>
</html>
