<!DOCTYPE html>
<html>
<head>
<title>WaveDrom Editor</title>
<script src="https://wavedrom.com/skins/default.js"></script>
<script src="https://wavedrom.com/wavedrom.min.js"></script>
<style>
body { margin: 20px; font-family: Arial; }
h2 { margin-top: 0; }
#editor { width: 100%; height: 250px; font-family: monospace; font-size: 13px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
button { padding: 10px 20px; margin: 10px 5px 10px 0; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
.save-btn { background: #4CAF50; color: white; }
.render-btn { background: #2196F3; color: white; }
.copy-btn { background: #ff9800; color: white; }
#wave { margin-top: 20px; border-top: 2px solid #ddd; padding-top: 20px; }
.info { color: #666; margin: 10px 0; font-size: 14px; }
.filename { background: #f0f0f0; padding: 8px; border-radius: 4px; margin: 10px 0; font-family: monospace; }
</style>
</head>
<body>

<h2>WaveDrom Editor</h2>

<div class="filename" id="filename"></div>

<textarea id="editor" placeholder="Your WaveDrom JSON code..."></textarea><br>

<button class="render-btn" onclick="render()">🔄 Render Preview</button>
<button class="save-btn" onclick="downloadJSON()">💾 Download JSON</button>
<button class="copy-btn" onclick="copyToClipboard()">📋 Copy Code</button>

<div class="info" id="info">Edit the code above and click "Render Preview"</div>

<div id="wave"></div>

<script>
var params = new URLSearchParams(window.location.search);
var code = params.get('code');
var filepath = params.get('file');

if (code) {
  document.getElementById('editor').value = decodeURIComponent(code);
  if (filepath) {
    document.getElementById('filename').textContent = '📄 Editing: ' + decodeURIComponent(filepath);
  }
  render();
} else {
  document.getElementById('filename').textContent = '📄 New file';
}

function render() {
  var code = document.getElementById('editor').value.trim();
  
  if (!code) {
    document.getElementById('info').textContent = '⚠️ Editor is empty';
    document.getElementById('info').style.color = '#ff9800';
    return;
  }
  
  try {
    var waveform = JSON.parse(code);
    document.getElementById('wave').innerHTML = '';
    WaveDrom.RenderWaveForm(0, waveform, 'wave');
    document.getElementById('info').textContent = '✅ Rendered successfully';
    document.getElementById('info').style.color = '#4CAF50';
  } catch(e) {
    document.getElementById('info').textContent = '❌ Invalid JSON: ' + e.message;
    document.getElementById('info').style.color = '#f44336';
  }
}

function downloadJSON() {
  var code = document.getElementById('editor').value;
  
  if (!code.trim()) {
    alert('Editor is empty!');
    return;
  }
  
  var filename = filepath ? decodeURIComponent(filepath).split('/').pop() : 'waveform.json';
  
  var blob = new Blob([code], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
  
  document.getElementById('info').textContent = '💾 Downloaded: ' + filename + ' → Now upload to GitHub to save changes';
  document.getElementById('info').style.color = '#4CAF50';
}

function copyToClipboard() {
  var code = document.getElementById('editor').value;
  
  if (!code.trim()) {
    alert('Editor is empty!');
    return;
  }
  
  navigator.clipboard.writeText(code).then(function() {
    document.getElementById('info').textContent = '✅ Copied to clipboard!';
    document.getElementById('info').style.color = '#4CAF50';
  }).catch(function() {
    alert('Failed to copy. Please select all (Cmd+A) and copy manually (Cmd+C)');
  });
}

// Auto-render when typing (with debounce)
var renderTimeout;
document.getElementById('editor').addEventListener('input', function() {
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(render, 1000);
});
</script>

</body>
</html>
